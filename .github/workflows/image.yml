name: image

# Weekly too, so the image follows Arch's Mesa.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts
        run: bash -n moonshine-test-headless view/moonshine-test-view view/moonshine-test-summary view/moonshine-test-compact

      - name: Build
        run: |
          podman build -t ghcr.io/${{ github.repository }}:latest .
          podman build -f view/Containerfile -t ghcr.io/${{ github.repository }}:view .

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/${{ github.repository }}:latest
          podman push ghcr.io/${{ github.repository }}:view
